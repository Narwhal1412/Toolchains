# docker-compose.yml
services:
  traefik:
    restart: unless-stopped
    container_name: traefik
    image: traefik:v3.7
    command:
      # Enable Access Log
      - "--accesslog=true"
      # Enable log level info
      - "--log.level=debug"

      - "--providers.docker.network=komodo_default"
      - "--providers.docker=true"
      
      # For testing
      # - "--api.insecure=true"

      # Prevent docker containers from being exposed by default,
      # meaning the service will require an explicit label added to it,
      # the label is: "traefik.enable=true'"
      - "--providers.docker.exposedbydefault=false"
      # Https
      - "--entryPoints.websecure.address=:443"

      # dashboard
      - "--api.dashboard=true"

      # Securing a Site with https
      # Certificate provider
      
      # Obtain an SSL certificate via acme using dns challenge(cloudflare).
      # https://doc.traefik.io/traefik/reference/install-configuration/tls/certificate-resolvers/acme/#opt-acme-dnsChallenge
      # - "--certificatesresolvers.myresolver.acme.dnsChallenge=true" Enabling the line below enables this line.
      - "--certificatesresolvers.myresolver.acme.dnsChallenge.provider=cloudflare"
      
      # Email associated with the certificate
      - "--certificatesresolvers.myresolver.acme.email=henry@hatamoto.uk"
      # Where to store the certificate
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"

      # HTTP auto redirect to HTTPS
      # Whenever traffic is detected on port 80
      - "--entrypoints.web.address=:80"
      # Auto redirect them to websecure port(443)
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      
    environment:
      - "CLOUDFLARE_DNS_API_TOKEN=${CF_TOKEN}"
      - "CLOUDFLARE_EMAIL=nnguyenhuy01@gmail.com"
    ports:
      - "443:443"
      - "80:80"
      # testing port for dashboard
      # Access through VPN
      # - "127.0.0.1:8080:8080"
    volumes:
      # attach itself to the docker socket,
      # so whenever a new container is created
      # automatically 
      - /var/run/docker.sock:/var/run/docker.sock
      - letsencrypt:/letsencrypt
    # Wildcard domain, Initially set for traefik dashboard,
    # Then cached for subsequent usage.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.middlewares=authentik@docker"
      # Map to the internal api dashboard, which is port 8080
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=myresolver"
      # Define Common Name(CN), and Subject Alternative Names(SANs) for X509 field
      - "traefik.http.routers.traefik-dashboard.tls.domains[0].main=hatamoto.uk"
      - "traefik.http.routers.traefik-dashboard.tls.domains[0].sans=*.hatamoto.uk"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.hatamoto.uk`)"

      # Authentik proxy:
      - "traefik.http.middlewares.authentik.forwardauth.address=http://authentik-proxy:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"
    networks:
      - komodo_default
    
      
  # Authentik middleware for SSO, relaying third party
  authentik-proxy:
        container_name: authentik_proxy
        image: ghcr.io/goauthentik/proxy:${AUTHENTIK_TAG}
        # ports:
        #     - 9000:9000
        #     - 9443:9443
        environment:
            AUTHENTIK_HOST: https://authentik.hatamoto.uk
            AUTHENTIK_INSECURE: "false"
            AUTHENTIK_TOKEN: ${authentik_token}
            # Starting with 2021.9, you can optionally set this too
            # when authentik_host for internal communication doesn't match the public URL
            # AUTHENTIK_HOST_BROWSER: https://authentik.hatamoto.uk
        # labels:
            # - "traefik.enable=true"
            # `authentik-proxy` refers to the service name in the compose file.
            # traefik.http.middlewares.authentik.forwardauth.address: http://authentik-proxy:9000/outpost.goauthentik.io/auth/traefik
            # traefik.http.middlewares.authentik.forwardauth.trustForwardHeader: true
            # traefik.http.middlewares.authentik.forwardauth.authResponseHeaders: X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version
            # # Add the 'authorization' header to authResponseHeaders if you need proxy providers which
            # send a custom HTTP-Basic Authentication header based on values from authentik
            
        restart: unless-stopped
        networks:
          - komodo_default

networks:
 komodo_default:
  # Reuse existing volume
  external: true

volumes:
  # Automatically create a letsencrypt volume
  letsencrypt:
